<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DrawBuddies — Widget Lab</title>
  <link rel="preload" href="https://excalidraw.nyc3.cdn.digitaloceanspaces.com/fonts/Excalifont-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <style>
    @font-face {
      font-family: 'Excalifont';
      src: url('https://excalidraw.nyc3.cdn.digitaloceanspaces.com/fonts/Excalifont-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @property --pct {
      syntax: '<percentage>';
      inherits: false;
      initial-value: 0%;
    }

    :root {
      --paper: #fbfdff;
      --ink: #201f1c;
      --panel: rgba(255, 252, 244, 0.88);
      --line: rgba(35, 32, 25, 0.16);
      --shadow: rgba(35, 32, 25, 0.16);
      --muted: rgba(32, 31, 28, 0.62);
      --accent: #2d5387;
      color-scheme: light;
    }

    :root.dark {
      --paper: #16171a;
      --ink: #ece7dc;
      --panel: rgba(32, 34, 38, 0.9);
      --line: rgba(236, 231, 220, 0.2);
      --shadow: rgba(0, 0, 0, 0.5);
      --muted: rgba(236, 231, 220, 0.6);
      --accent: #8fb6f0;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.4), transparent 24rem),
        linear-gradient(135deg, rgba(0,0,0,0.018) 25%, transparent 25%) 0 0 / 18px 18px,
        var(--paper);
      color: var(--ink);
      font-family: 'Excalifont', ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 15px;
    }

    .shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; }

    /* ---- control rail ---- */
    .rail {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      overflow-y: auto;
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(12px);
    }
    .rail h1 { margin: 0 0 2px; font-size: 19px; }
    .rail .sub { margin: 0 0 20px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .ctrl { margin-bottom: 14px; }
    .ctrl label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .ctrl input[type="range"] { width: 100%; accent-color: var(--accent); }
    .rail button {
      width: 100%;
      margin-bottom: 8px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    .rail button:hover { border-color: var(--ink); }
    #readout {
      margin-top: 14px;
      padding: 9px;
      border-radius: 9px;
      background: rgba(127,127,127,0.12);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      line-height: 1.6;
    }
    #nav { display: flex; flex-direction: column; gap: 3px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    #nav a { color: var(--muted); font-size: 12.5px; text-decoration: none; }
    #nav a:hover { color: var(--ink); }

    /* ---- sections ---- */
    main { padding: 30px 34px 90px 0; max-width: 1100px; }
    .lab-section { margin-bottom: 46px; padding-bottom: 34px; border-bottom: 1px dashed var(--line); }
    .lab-section:last-child { border-bottom: none; }
    .lab-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .lab-head h3 { margin: 0; font-size: 21px; }
    .lab-tier {
      padding: 2px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
    }
    .lab-note { max-width: 66ch; margin: 7px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .lab-subhead { margin: 26px 0 12px; color: var(--muted); font-size: 12.5px; font-weight: 400; }
    .lab-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 18px; }
    .lab-row--wide { gap: 26px; }
    .lab-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .lab-cell--grow { flex: 1 1 300px; }
    .lab-caption { color: var(--muted); font-size: 11px; }
    .lab-metric {
      margin: 14px 0 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }
    .lab-error {
      padding: 12px;
      border: 1px solid #c0392b;
      border-radius: 8px;
      background: rgba(192, 57, 43, 0.08);
      color: #c0392b;
      font-size: 11px;
      white-space: pre-wrap;
    }
    .lab-action {
      margin-top: 16px;
      padding: 6px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    .lab-action.is-on { border-color: var(--ink); background: rgba(127,127,127,0.16); }

    /* ---- skin plumbing ---- */
    .skinned { position: relative; border: none; background: transparent; }
    .skin-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .skinned > :not(.skin-svg) { position: relative; }

    /* ---- buttons ---- */
    .skin-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 132px;
      height: 40px;
      padding: 0;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      --skin-fill: transparent;
      transition: color 120ms ease;
    }
    .skin-btn:hover, .skin-btn.is-hover { --skin-fill: rgba(127,127,127,0.14); }
    .skin-btn:active, .skin-btn.is-active { --skin-fill: rgba(127,127,127,0.3); }
    .skin-btn.is-selected { color: var(--accent); --skin-fill: rgba(45,83,135,0.14); }
    .skin-btn.is-disabled, .skin-btn:disabled { opacity: 0.38; cursor: not-allowed; --skin-fill: transparent; }

    /* ---- inventory ---- */
    .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, var(--slot)); gap: 7px; max-width: 640px; }
    .inv-slot {
      position: relative;
      width: var(--slot);
      height: var(--slot);
      padding: 0;
      border: none;
      background: transparent no-repeat center / 100% 100%;
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      contain: layout paint;
      transition: transform 90ms ease;
    }
    .inv-slot:hover { transform: translateY(-2px); }
    .inv-slot.is-selected { outline: 2px dashed var(--accent); outline-offset: 2px; }
    .inv-slot.is-locked { opacity: 0.35; cursor: not-allowed; }
    .inv-item { font-size: 26px; line-height: 1; }
    .inv-count { position: absolute; right: 6px; bottom: 3px; color: var(--muted); font-size: 10.5px; }

    /* ---- bars ---- */
    .bar-list { display: flex; flex-direction: column; gap: 13px; }
    .bar-wrap { display: flex; align-items: center; gap: 13px; }
    .bar-label { width: 78px; color: var(--muted); font-size: 12.5px; }
    .bar-pct { width: 46px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
    .bar { position: relative; background: no-repeat center / 100% 100%; }
    .bar-fill {
      position: absolute;
      inset: 0;
      background: no-repeat center / 100% 100%;
      clip-path: inset(0 calc(100% - var(--pct)) 0 0);
      transition: --pct 420ms ease;
    }
    /* Fill colours are baked into the sprite (see elements/bars.js) — a data-URI
       has no host document to resolve currentColor against. */

    /* ---- panels ---- */
    .panel {
      min-width: 200px;
      min-height: 130px;
      padding: 20px 24px;
      overflow: auto;
      resize: both;
      color: var(--ink);
    }
    .panel h4 { margin: 0 0 7px; font-size: 15px; }
    .panel p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
    .panel--slice { border-style: solid; border-color: transparent; }
    .panel--regen { background: no-repeat center / 100% 100%; }

    /* ---- fields ---- */
    .field-list { display: flex; flex-direction: column; gap: 15px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field > span { color: var(--muted); font-size: 12px; }
    .field input, .field textarea {
      padding: 0 14px;
      border: none;
      background: transparent no-repeat center / 100% 100%;
      color: var(--ink);
      font: inherit;
    }
    .field textarea { padding: 12px 14px; resize: vertical; }
    .field input:focus, .field textarea:focus { outline: 2px dashed var(--accent); outline-offset: 3px; }

    @media (max-width: 780px) {
      .shell { grid-template-columns: 1fr; }
      .rail { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
      main { padding: 22px 18px 60px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <h1>Widget Lab</h1>
      <p class="sub">Work-in-progress rough.js UI elements. See <code>docs/ui-architecture.md</code>.</p>

      <div class="ctrl">
        <label for="roughness">roughness <span id="roughnessValue">1.4</span></label>
        <input id="roughness" type="range" min="0" max="4" step="0.1" value="1.4" />
      </div>
      <div class="ctrl">
        <label for="bowing">bowing <span id="bowingValue">1.5</span></label>
        <input id="bowing" type="range" min="0" max="6" step="0.1" value="1.5" />
      </div>
      <div class="ctrl">
        <label for="strokeWidth">strokeWidth <span id="strokeWidthValue">1.6</span></label>
        <input id="strokeWidth" type="range" min="0.5" max="5" step="0.1" value="1.6" />
      </div>
      <div class="ctrl">
        <label for="variants">seed variants <span id="variantsValue">4</span></label>
        <input id="variants" type="range" min="1" max="8" step="1" value="4" />
      </div>

      <button id="reroll" type="button">⟳ Re-roll seeds</button>
      <button id="reset" type="button">↺ Reset defaults</button>
      <button id="theme" type="button">☾ Dark</button>

      <div id="readout">—</div>
      <nav id="nav"></nav>
    </aside>

    <main id="sections"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
  <script type="module" src="./gallery.js"></script>
</body>
</html>
